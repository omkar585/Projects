<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Profile - ShopperShop</title>

    <link rel="stylesheet" href="./admin.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="admin-container">
      <!-- Sidebar -->

      <aside class="sidebar">
        <div class="logo">
          <h2>ShopperShop</h2>

          <span>Admin Panel</span>
        </div>

        <ul>
          <li>
            <a href="./Dashboard.html">
              <i class="fa-solid fa-house"></i>
              Dashboard
            </a>
          </li>

          <li class="active">
            <a href="./profile.html">
              <i class="fa-solid fa-user"></i>
              Profile
            </a>
          </li>

          <li>
            <a href="./productreview.html">
              <i class="fa-solid fa-check"></i>
              Product Review
            </a>
          </li>

          <li>
            <a href="./product.html">
              <i class="fa-solid fa-box"></i>
              Products
            </a>
          </li>

          <li>
            <a href="./sellers.html">
              <i class="fa-solid fa-store"></i>
              Sellers
            </a>
          </li>

          <li>
            <a href="#">
              <i class="fa-solid fa-users"></i>
              Users
            </a>
          </li>
        </ul>
      </aside>

      <!-- Main -->

      <main class="main">
        <header class="topbar">
          <h2>Admin Profile</h2>

          <div class="admin-info">
            <img src="https://i.pravatar.cc/100" />

            <div>
              <h4>Admin</h4>

              <span>Super Admin</span>
            </div>
          </div>
        </header>

        <section class="profile-layout">
          <div class="profile-box">
            <img src="https://i.pravatar.cc/150" />

            <h2>John Admin</h2>

            <p>Super Administrator</p>

            <button class="btn">Change Photo</button>
          </div>

          <div class="form-box">
            <h2>Personal Information</h2>

            <div class="form-grid">
              <div class="form-group">
                <label>Name</label>

                <input value="John Admin" />
              </div>

              <div class="form-group">
                <label>Email</label>

                <input value="admin@shoppershop.com" />
              </div>

              <div class="form-group">
                <label>Phone</label>

                <input value="+91 9876543210" />
              </div>

              <div class="form-group">
                <label>Role</label>

                <input value="Admin" />
              </div>

              <div class="form-group">
                <label>Password</label>

                <input type="password" />
              </div>

              <div class="form-group">
                <label>Confirm Password</label>

                <input type="password" />
              </div>
            </div>

            <button class="btn">Save Changes</button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
